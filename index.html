<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Sorry ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --pink:#ff4d88;
    --pink-dark:#e63972;
    --glass:rgba(255,255,255,.16);
    --glass-border:rgba(255,255,255,.35);
}

html,body{
    height:100%;
}

body{
    overflow:hidden;
    font-family:'Poppins',Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#ffb6c1,#fad0c4,#ffd1ff,#ffc3a0);
    background-size:400% 400%;
    animation:bgShift 12s ease infinite;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

@keyframes bgShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* ---- Floating hearts background ---- */
.hearts{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

.heart{
    position:absolute;
    bottom:-60px;
    color:rgba(255,45,117,.55);
    animation:floatUp linear forwards;
    filter:drop-shadow(0 0 6px rgba(255,45,117,.4));
}

@keyframes floatUp{
    0%{
        transform:translateY(0) rotate(0deg) scale(.6);
        opacity:0;
    }
    10%{opacity:1;}
    100%{
        transform:translateY(-115vh) rotate(360deg) scale(1.4);
        opacity:0;
    }
}

/* ---- Glow orbs behind card ---- */
.orb{
    position:fixed;
    border-radius:50%;
    filter:blur(60px);
    opacity:.5;
    z-index:0;
    pointer-events:none;
}
.orb-1{width:280px;height:280px;background:#ff9a9e;top:-60px;left:-60px;}
.orb-2{width:320px;height:320px;background:#a18cd1;bottom:-80px;right:-80px;}

/* ---- Card glassmorphism ---- */
.card{
    position:relative;
    z-index:2;
    width:92%;
    max-width:520px;
    padding:45px 40px;
    text-align:center;
    border-radius:28px;
    background:var(--glass);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid var(--glass-border);
    box-shadow:0 20px 50px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.4);
    animation:cardIn .8s ease-out both;
}

@keyframes cardIn{
    from{opacity:0;transform:translateY(40px) scale(.95);}
    to{opacity:1;transform:translateY(0) scale(1);}
}

.card.glow{
    animation:glowPulse 1.2s ease-in-out infinite;
}

@keyframes glowPulse{
    0%,100%{box-shadow:0 20px 50px rgba(255,45,117,.4),0 0 40px rgba(255,45,117,.35),inset 0 1px 0 rgba(255,255,255,.4);}
    50%{box-shadow:0 20px 60px rgba(255,45,117,.7),0 0 80px rgba(255,45,117,.6),inset 0 1px 0 rgba(255,255,255,.4);}
}

h1{
    font-family:'Playfair Display',serif;
    font-size:2.4em;
    color:#fff;
    text-shadow:0 2px 12px rgba(255,45,117,.4);
    margin-bottom:18px;
}

.ornament{
    font-size:1.4em;
    color:#ffd1ff;
    margin-bottom:16px;
    letter-spacing:4px;
}

#text{
    font-size:1.12em;
    line-height:1.7;
    color:#fff;
    font-weight:300;
    margin-bottom:8px;
}

/* ---- Buttons ---- */
.buttons{
    margin-top:34px;
    position:relative;
    min-height:150px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}

button{
    font-family:'Poppins',sans-serif;
    font-size:18px;
    font-weight:600;
    padding:15px 40px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    transition:transform .25s ease, box-shadow .25s ease;
    letter-spacing:.5px;
    position:relative;
    z-index:2;
}

#yes{
    background:linear-gradient(135deg,#ff4d88,#ff6b9d);
    color:#fff;
    box-shadow:0 8px 24px rgba(255,45,117,.45);
}
#yes:hover{
    transform:scale(1.08);
    box-shadow:0 10px 30px rgba(255,45,117,.6);
}

#no{
    background:rgba(255,255,255,.9);
    color:var(--pink-dark);
    box-shadow:0 8px 24px rgba(0,0,0,.15);
    transition:left .5s cubic-bezier(.34,1.56,.64,1), top .5s cubic-bezier(.34,1.56,.64,1), transform .25s ease, box-shadow .25s ease;
}
#no:hover{
    transform:scale(1.08);
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

/* ---- Message ---- */
#message{
    margin-top:22px;
    font-weight:600;
    font-size:1.05em;
    color:#fff;
    min-height:28px;
    text-shadow:0 1px 8px rgba(0,0,0,.15);
}

/* ---- Confetti ---- */
.confetti{
    position:fixed;
    width:10px;
    height:14px;
    z-index:5;
    pointer-events:none;
    animation:fall 4s linear forwards;
}

@keyframes fall{
    from{transform:translateY(-60px) rotate(0deg);opacity:1;}
    to{transform:translateY(115vh) rotate(720deg);opacity:.6;}
}

/* ---- Heart burst ---- */
.burst-heart{
    position:fixed;
    z-index:6;
    pointer-events:none;
    font-size:30px;
    animation:burst 1.6s ease-out forwards;
}

@keyframes burst{
    from{transform:translate(0,0) scale(.4);opacity:1;}
    to{transform:translate(var(--tx),var(--ty)) scale(1.6);opacity:0;}
}

/* ---- Responsive ---- */
@media (max-width:600px){
    .card{padding:35px 24px;}
    h1{font-size:1.9em;}
    #text{font-size:1em;}
    button{padding:13px 32px;font-size:16px;}
    .buttons{min-height:130px;}
}
</style>
</head>
<body>

<!-- Floating background hearts -->
<div class="hearts" id="hearts"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="card" id="card">
    <div class="ornament">❀ ❀ ❀</div>
    <h1>I'm Sorry ❤️</h1>
    <p id="text">I know I made mistakes, and I truly regret hurting you. I never meant to cause you pain. From the bottom of my heart, I'm asking for your forgiveness.</p>

    <div class="buttons" id="buttonsBox">
        <button id="yes">Yes ❤️</button>
        <button id="no">No 💔</button>
    </div>

    <p id="message"></p>
</div>

<script>
// ---- Elements ----
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const msg = document.getElementById("message");
const text = document.getElementById("text");
const card = document.getElementById("card");
const buttonsBox = document.getElementById("buttonsBox");
const heartsContainer = document.getElementById("hearts");

// ---- Cute Messages ----
const noMessages = [
    "Are you sure? 🥺",
    "Please give me another chance. ❤️",
    "Think again... 💕",
    "My heart is breaking... 💔",
    "Pretty please? 🌹",
    "I'll do better. 🥹",
    "Don't leave me. 😭",
    "Just one more chance? 💖",
    "You're too precious to lose. ❤️",
    "Please? 🥺👉👈",
    "I promise I'll change. 🌸",
    "Forgive me? 💗"
];

let noCount = 0;

// -------------------------
// Floating Hearts
// -------------------------
function spawnHeart() {
    const h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = Math.random() > 0.5 ? "❤" : "💗";
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = (18 + Math.random() * 30) + "px";
    h.style.animationDuration = (6 + Math.random() * 6) + "s";

    heartsContainer.appendChild(h);

    setTimeout(() => {
        h.remove();
    }, 13000);
}

setInterval(spawnHeart, 350);

// -------------------------
// Unlimited No Button Move
// -------------------------
function moveNoButton() {

    noBtn.style.position = "absolute";

    const box = buttonsBox.getBoundingClientRect();

    const btnWidth = noBtn.offsetWidth;
    const btnHeight = noBtn.offsetHeight;

    const x = Math.random() * (box.width - btnWidth);
    const y = Math.random() * (box.height - btnHeight);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    msg.innerHTML = noMessages[noCount % noMessages.length];

    noCount++;
}

noBtn.addEventListener("mouseover", moveNoButton);
noBtn.addEventListener("click", moveNoButton);

// -------------------------
// Confetti
// -------------------------
function createConfetti() {

    for (let i = 0; i < 200; i++) {

        const c = document.createElement("div");

        c.className = "confetti";

        c.style.left = Math.random() * 100 + "vw";
        c.style.background = `hsl(${Math.random()*360},100%,60%)`;
        c.style.animationDelay = (Math.random()*1.5)+"s";
        c.style.animationDuration = (2.5+Math.random()*2)+"s";

        document.body.appendChild(c);

        setTimeout(() => {
            c.remove();
        },6000);
    }

}

// -------------------------
// Heart Burst
// -------------------------
function createHeartBurst(){

    for(let i=0;i<26;i++){

        const h=document.createElement("div");

        h.className="burst-heart";

        h.innerHTML=["❤","💖","💗","💕","🩷"][Math.floor(Math.random()*5)];

        const angle=(Math.PI*2*i)/26;
        const dist=60+Math.random()*90;

        h.style.left="50%";
        h.style.top="50%";

        h.style.setProperty("--tx",Math.cos(angle)*dist+"px");
        h.style.setProperty("--ty",Math.sin(angle)*dist+"px");

        h.style.fontSize=(18+Math.random()*24)+"px";

        document.body.appendChild(h);

        setTimeout(()=>{
            h.remove();
        },1600);

    }

}

// -------------------------
// YES Button
// -------------------------
function showSuccess(){

    text.innerHTML="Thank you for forgiving me. ❤️ I promise to do better.";

    msg.innerHTML="💖 You just made my whole world brighter! 💖";

    yesBtn.style.display="none";
    noBtn.style.display="none";

    card.classList.add("glow");

    createConfetti();
    createHeartBurst();

    for(let i=0;i<10;i++){
        spawnHeart();
    }

}

yesBtn.addEventListener("click",showSuccess);
</script>

</body>
</html>
