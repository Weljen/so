<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Sorry ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow:hidden;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4,#ffd1ff);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:90%;
    max-width:500px;
    padding:40px;
    text-align:center;
    border-radius:25px;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.3);
    box-shadow:0 8px 30px rgba(0,0,0,.2);
    color:white;
    position:relative;
}

h1{
    font-size:2.2em;
    margin-bottom:15px;
}

p{
    font-size:1.15em;
    line-height:1.6;
}

.buttons{
    margin-top:35px;
    position:relative;
    height:120px;
}

button{
    padding:15px 35px;
    border:none;
    border-radius:40px;
    cursor:pointer;
    font-size:18px;
    transition:.3s;
    position:absolute;
}

#yes{
    left:50%;
    transform:translateX(-120%);
    background:#ff4d88;
    color:white;
}

#yes:hover{
    transform:translateX(-120%) scale(1.08);
}

#no{
    left:50%;
    transform:translateX(20%);
    background:white;
    color:#ff4d88;
}

.hearts{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:hidden;
}

.heart{
    position:absolute;
    color:#ff2d75;
    font-size:25px;
    animation:float 5s linear forwards;
}

@keyframes float{
    0%{
        transform:translateY(100vh) scale(.5);
        opacity:1;
    }
    100%{
        transform:translateY(-120vh) scale(1.8);
        opacity:0;
    }
}

.confetti{
    position:absolute;
    width:10px;
    height:10px;
    animation:fall 4s linear forwards;
}

@keyframes fall{
    from{
        transform:translateY(-50px) rotate(0deg);
    }
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}

#message{
    margin-top:20px;
    font-weight:bold;
    color:#fff;
}
</style>

</head>
<body>

<div class="card">

<h1>I'm Sorry ❤️</h1>

<p id="text">
I know I made mistakes...
Can you please forgive me?
</p>

<div class="buttons">
<button id="yes">Yes ❤️</button>
<button id="no">No 💔</button>
</div>

<p id="message"></p>

</div>

<div class="hearts"></div>

<script>

const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");
const msg=document.getElementById("message");
const text=document.getElementById("text");

const messages=[
"Are you sure? 🥺",
"Please give me another chance. ❤️",
"I'll keep trying until you say yes. 💕",
"You mean the world to me. 🥹",
"Pretty please? 🌹",
"I promise to do better. ❤️"
];

let count=0;

noBtn.addEventListener("click",()=>{

    msg.innerHTML=messages[count%messages.length];
    count++;

    const maxX=window.innerWidth-120;
    const maxY=window.innerHeight-70;

    noBtn.style.left=Math.random()*maxX+"px";
    noBtn.style.top=Math.random()*maxY+"px";
});

yesBtn.addEventListener("click",()=>{

text.innerHTML="Thank you for forgiving me! ❤️<br>I promise to cherish you forever.";

msg.innerHTML="❤️ You made my day! ❤️";

yesBtn.style.display="none";
noBtn.style.display="none";

createHearts();
createConfetti();

});

function createHearts(){

setInterval(()=>{

const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤";

heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(20+Math.random()*30)+"px";

document.querySelector(".hearts").appendChild(heart);

setTimeout(()=>{
heart.remove();
},5000);

},180);

}

function createConfetti(){

for(let i=0;i<250;i++){

const c=document.createElement("div");

c.className="confetti";

c.style.left=Math.random()*100+"vw";
c.style.background=`hsl(${Math.random()*360},100%,60%)`;
c.style.animationDelay=Math.random()*2+"s";

document.body.appendChild(c);

setTimeout(()=>{
c.remove();
},5000);

}

}

</script>

</body>
</html>
